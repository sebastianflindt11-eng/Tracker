<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender Tracker Gold</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --tile-white: #ffffff;
            --tile-green: #4CAF50;
            --tile-red: #f44336;
            --primary: #2196F3;
            --text-main: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        .month-display { font-size: 1.4rem; font-weight: bold; }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

        /* Zähler Bereich */
        .counter-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .counter-item { text-align: center; font-weight: bold; }
        .count-val { font-size: 1.2rem; display: block; }
        .text-green { color: var(--tile-green); }
        .text-red { color: var(--tile-red); }

        /* Kalender Gitter */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            max-width: 400px;
            width: 100%;
        }

        .weekday-label {
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #777;
            padding-bottom: 5px;
        }

        .day-tile {
            aspect-ratio: 1 / 1;
            background-color: var(--tile-white);
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .empty-tile { background: transparent; border: none; cursor: default; }

        /* Farben */
        .day-tile[data-state="neutral"] { background-color: var(--tile-white); }
        .day-tile[data-state="green"] { background-color: var(--tile-green); color: white; border-color: #388E3C; }
        .day-tile[data-state="red"] { background-color: var(--tile-red); color: white; border-color: #d32f2f; }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <div class="month-display" id="monthDisplay">Monat Jahr</div>
        <button class="nav-btn" onclick="changeMonth(+1)">▶</button>
    </div>

    <div class="counter-container">
        <div class="counter-item">
            <span class="count-val text-green" id="greenCount">0</span>
            <span>Grün</span>
        </div>
        <div class="counter-item">
            <span class="count-val text-red" id="redCount">0</span>
            <span>Rot</span>
        </div>
    </div>

    <div class="calendar-grid" id="calendar">
        </div>

    <script>
        let currentDate = new Date();
        const weekdays = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
        const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('monthDisplay').innerText = `${monthNames[month]} ${year}`;

            // 1. Wochentage Header hinzufügen
            weekdays.forEach(day => {
                const div = document.createElement('div');
                div.classList.add('weekday-label');
                div.innerText = day;
                calendar.appendChild(div);
            });

            // 2. Leere Kacheln am Anfang (Berechnung des Wochentags für den 1.)
            let firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 ist Sonntag
            let offset = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; // Umrechnung auf Mo=0

            for (let i = 0; i < offset; i++) {
                const empty = document.createElement('div');
                empty.classList.add('day-tile', 'empty-tile');
                calendar.appendChild(empty);
            }

            // 3. Echte Tages-Kacheln
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                const tile = document.createElement('div');
                tile.classList.add('day-tile');
                tile.innerText = i;
                
                const storageKey = `track-${year}-${month}-${i}`;
                const savedState = localStorage.getItem(storageKey) || 'neutral';
                tile.setAttribute('data-state', savedState);

                tile.onclick = () => {
                    const nextState = (tile.getAttribute('data-state') === 'neutral') ? 'green' : (tile.getAttribute('data-state') === 'green' ? 'red' : 'neutral');
                    tile.setAttribute('data-state', nextState);
                    localStorage.setItem(storageKey, nextState);
                    updateCounters(); // Zähler aktualisieren nach Klick
                };

                calendar.appendChild(tile);
            }
            updateCounters(); // Zähler beim Laden initialisieren
        }

        function updateCounters() {
            const allTiles = document.querySelectorAll('.day-tile:not(.empty-tile)');
            let green = 0, red = 0;
            allTiles.forEach(t => {
                if(t.getAttribute('data-state') === 'green') green++;
                if(t.getAttribute('data-state') === 'red') red++;
            });
            document.getElementById('greenCount').innerText = green;
            document.getElementById('redCount').innerText = red;
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
